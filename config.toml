def page_news_feed():
    st.header("News Feed")
    st.markdown("Browse headlines from BBC, CNN (via Google News RSS), Reuters (via Google News RSS), Al Jazeera and GDELT. Headlines, feed summaries (when available), publication dates and links are shown. The app does NOT fetch full article HTML or bypass paywalls.")
    source_options = ["All","BBC","CNN","Reuters","Al Jazeera","GDELT","Guardian"]
    source_choice = st.selectbox("Source", source_options, index=0)
    topic_options = ["War","Diplomacy","International organizations","Global economy","Mongolia"]
    topic_selected = st.multiselect("Topics", options=topic_options)
    search_text = st.text_input("Search headlines / sources")

    sources_filter = None if source_choice == "All" else [source_choice]
    articles, errors = fetch_combined_news(sources_filter=sources_filter, topics_filter=topic_selected, limit_per_feed=10, gdelt_per_topic=4)
    if errors:
        for e in errors:
            st.warning(f"Feed message: {e}")

    if search_text:
        q = search_text.lower()
        articles = [a for a in articles if q in ((a.get("title") or "") + " " + (a.get("summary") or "") + " " + (a.get("source") or "")).lower()]

    st.markdown(f"Found {len(articles)} articles")
    for a in articles:
        title = a.get("title") or "No title"
        src = a.get("source") or a.get("origin") or ""
        published = a.get("published") or "Unknown date"
        summary = a.get("summary") or ""
        url = a.get("url") or ""
        st.markdown("<div class='card'>", unsafe_allow_html=True)
        st.markdown(f"<div class='headline'>{title}</div>", unsafe_allow_html=True)
        st.markdown(f"<div class='muted'>{src} • {published}</div>", unsafe_allow_html=True)
        if summary:
            st.markdown(f"<div style='margin-top:8px;color:#4a2a3f'>{summary}</div>", unsafe_allow_html=True)
        else:
            st.markdown("<div style='margin-top:8px;color:#6b4b5f'><em>No feed summary available</em></div>", unsafe_allow_html=True)
        if url:
            st.markdown(f"<div style='margin-top:8px;text-align:right'><a class='link-btn' href='{url}' target='_blank'>Open original</a></div>", unsafe_allow_html=True)
        st.markdown("</div>", unsafe_allow_html=True)
        col1, col2 = st.columns([1,1])
        with col1:
            if st.button("Save article", key=f"save_{short_hash(url)}"):
                ok = save_article_to_db({"title": title, "url": url, "source": src, "published": published, "summary": summary})
                if ok:
                    st.success("Saved article.")
                else:
                    st.info("Article may already exist or save failed.")
        with col2:
            if st.button("Save to notes", key=f"note_{short_hash(url)}"):
                st.session_state.prefill_note = {"title": title, "content": f"Source: {src}\nURL: {url}\n\n{summary}\n\nYour analysis:"}
                st.session_state.page = "Lecture Notes"; st.experimental_rerun()

