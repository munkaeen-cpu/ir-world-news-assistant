        st.markdown("<div class='card'><div class='headline'>Quick Stats</div><div class='muted'>Your recent activity at a glance</div></div>", unsafe_allow_html=True)
        try:
            notes = db_query("SELECT COUNT(*) FROM notes").fetchone()[0] if db_query("SELECT COUNT(*) FROM notes") else 0
        except Exception:
            notes = 0
        try:
            cards = db_query("SELECT COUNT(*) FROM flashcards").fetchone()[0] if db_query("SELECT COUNT(*) FROM flashcards") else 0
        except Exception:
            cards = 0
        st.metric("Saved notes", notes)
        st.metric("Saved flashcards", cards)
        st.markdown("<div class='card'><div class='headline'>Daily concept</div></div>", unsafe_allow_html=True)
        concept = random.choice(list(IR_THEORIES.keys()))
        st.markdown(f"**{concept}**")
        st.write(IR_THEORIES[concept]["definition"] if IR_THEORIES.get(concept) else "")

